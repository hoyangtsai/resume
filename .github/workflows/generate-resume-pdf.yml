name: Generate resume PDF

on:
  push:
    branches:
      - main
    paths-ignore:
      - assets/resume.pdf
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-resume-pdf
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install WeasyPrint
        run: |
          python -m pip install --upgrade pip
          python -m pip install weasyprint

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Generate PDF with print CSS
        run: |
          python - <<'PY'
          from pathlib import Path

          site = Path("_site").resolve()
          html_path = site / "index.html"
          html = html_path.read_text()

          replacements = {
              'href="/assets/css/style.css?v=1"':
                  f'href="file://{site / "assets/css/style.css"}"',
              'href="/styles/index.css?v=1"':
                  f'href="file://{site / "styles/index.css"}"',
              'src="/assets/js/scale.fix.js"':
                  f'src="file://{site / "assets/js/scale.fix.js"}"',
          }

          for old, new in replacements.items():
              html = html.replace(old, new)

          Path("/tmp/resume.html").write_text(html)
          PY

          weasyprint --media-type print /tmp/resume.html assets/resume.pdf

      - name: Commit refreshed PDF
        run: |
          if git diff --quiet -- assets/resume.pdf; then
            echo "PDF is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/resume.pdf
          git commit -m "chore: update generated resume PDF [skip ci]"
          git push
