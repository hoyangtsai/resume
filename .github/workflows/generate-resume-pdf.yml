name: Generate resume PDF

on:
  push:
    branches:
      - main
    paths-ignore:
      - assets/resume.pdf
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-resume-pdf
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Generate PDF with Chromium print CSS
        run: |
          python3 -m http.server 4000 --directory _site > /tmp/resume-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4000/ > /dev/null; then
              break
            fi
            sleep 0.5
          done

          curl --fail --silent http://127.0.0.1:4000/ > /dev/null
          node scripts/generate-resume-pdf.mjs

      - name: Commit refreshed PDF
        run: |
          if git diff --quiet -- assets/resume.pdf; then
            echo "PDF is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/resume.pdf
          git commit -m "chore: update generated resume PDF [skip ci]"
          git push
